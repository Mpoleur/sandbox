<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860"><title>Data model</title><defs><marker id="arun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#212121"/></marker><marker id="srun" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#212121"/></marker><marker id="adeploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#455A64"/></marker><marker id="sdeploy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#455A64"/></marker><marker id="afut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B1FA2"/></marker><marker id="sfut" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#7B1FA2"/></marker></defs><rect width="1200" height="860" fill="#FFFFFF"/><text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#212121">Schema 3. Data: stored on the device, shipped inside the APK, and reserved for later</text><text x="20" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2E7D32">Stored on the device: SQLite database + photo files</text><rect x="20" y="72" width="330" height="180" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><line x1="20" y1="102" x2="350" y2="102" stroke="#2E7D32" stroke-width="1.5"/><text x="30" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Card</text><text x="340" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">table</text><text x="30" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">id (UUID)</text><text x="30" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">photoFile, thumbFile (file names, optional)</text><text x="30" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">label, showLabel (default off)</text><text x="30" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">categoryId</text><text x="30" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">favourite, favouriteOrder (favourites only)</text><text x="30" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">sortOrder (within its category)</text><text x="30" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">exampleKey (only on example cards)</text><text x="30" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">createdAt, updatedAt</text><rect x="20" y="262" width="330" height="112" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><line x1="20" y1="292" x2="350" y2="292" stroke="#2E7D32" stroke-width="1.5"/><text x="30" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Card item</text><text x="340" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">table, one row per item</text><text x="30" y="311" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">cardId, position (V1: only position 0)</text><text x="30" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">symbolId, e.g. DIE-01 (a library symbol)</text><text x="30" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">badges: up to 2 symbol IDs, in order</text><text x="30" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">   MOD-01 counts but takes no slot; the other is badge 1</text><rect x="390" y="72" width="300" height="112" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><line x1="390" y1="102" x2="690" y2="102" stroke="#2E7D32" stroke-width="1.5"/><text x="400" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Photo files</text><text x="680" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">files, not rows</text><text x="400" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">photos/&lt;id&gt;.jpg: long edge max 1600 px</text><text x="400" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">thumbs/&lt;id&gt;.jpg: about 320 px</text><text x="400" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">in the app&#x27;s private folder</text><text x="400" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">a file with no card is deleted at start</text><rect x="390" y="215" width="300" height="129" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><line x1="390" y1="245" x2="690" y2="245" stroke="#2E7D32" stroke-width="1.5"/><text x="400" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Category</text><text x="680" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">table</text><text x="400" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">id</text><text x="400" y="281" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">key (default ones) or name (custom)</text><text x="400" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">isDefault, hidden, sortOrder</text><text x="400" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">no icon; 13 defaults, &quot;Modifiers&quot;</text><text x="400" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">is a library group, never a category</text><rect x="390" y="390" width="300" height="112" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><line x1="390" y1="420" x2="690" y2="420" stroke="#2E7D32" stroke-width="1.5"/><text x="400" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Settings</text><text x="680" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">few key-value rows</text><text x="400" y="439" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">brightnessOnDisplay (Could have)</text><text x="400" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">safetyNoticeSeen</text><text x="400" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">examplesSeeded</text><text x="400" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">database version: PRAGMA user_version</text><text x="730" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1565C0">Inside the APK (read-only)</text><rect x="730" y="72" width="445" height="163" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><line x1="730" y1="102" x2="1175" y2="102" stroke="#1565C0" stroke-width="1.5"/><text x="740" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Symbol catalog: symbols.json</text><text x="1165" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">168 entries</text><text x="740" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">id (never reused or renumbered)</text><text x="740" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">categoryKey, isModifier, priority (P1, P2)</text><text x="740" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">svg: the matching file of the 168</text><text x="740" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">review: &quot;ok&quot; or &quot;needs-check&quot; (10 hidden)</text><text x="740" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">alreadyCrossed: true for DIE-13, MON-08,</text><text x="740" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">   REL-01, REL-04, REL-05, REL-06</text><text x="740" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">No names or meanings here: they live in the text files</text><rect x="730" y="250" width="445" height="129" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><line x1="730" y1="280" x2="1175" y2="280" stroke="#1565C0" stroke-width="1.5"/><text x="740" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Text catalog: en.json (later fr.json ...)</text><text x="1165" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">one file per language</text><text x="740" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">&quot;symbol.DIE-01.name&quot;: &quot;Peanut&quot;</text><text x="740" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">&quot;symbol.DIE-01.meaning&quot;: &quot;Peanut&quot;</text><text x="740" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">&quot;category.diet-allergies&quot;: &quot;Diet &amp; allergies&quot;</text><text x="740" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">&quot;ui.home.search&quot;: &quot;Search&quot;</text><text x="740" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">Missing key in another language: falls back to English</text><text x="730" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#7B1FA2">Later releases</text><rect x="730" y="402" width="445" height="78" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="730" y1="432" x2="1175" y2="432" stroke="#7B1FA2" stroke-width="1.5"/><text x="740" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Translation (V2)</text><text x="1165" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">new table</text><text x="740" y="451" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">id, cardId, sourceText, targetLanguage (e.g. zh-Hant)</text><text x="740" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">translatedText, backTranslation, provider, createdAt</text><rect x="730" y="480" width="445" height="78" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="730" y1="510" x2="1175" y2="510" stroke="#7B1FA2" stroke-width="1.5"/><text x="740" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">Backup file / card pack (V2 backup, V3 packs)</text><text x="1165" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end" fill="#455A64">same format for both</text><text x="740" y="529" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">one file: formatVersion, cards, categories, photos</text><text x="740" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">import adds copies with new IDs, never overwrites</text><polyline points="350,120 390,120" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="350,150 370,150 370,236 390,236" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="350,358 710,358 710,150 730,150" fill="none" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><rect x="527.3" y="363" width="65.4" height="16" fill="#FFFFFF" opacity="0.9"/><text x="560" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#455A64">symbol ID</text><text x="20" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#212121">Reading the schema</text><text x="28" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- A card holds an ordered list of items. V1 allows one item, but the table, the per-item badges and the renderer already work for several: that keeps &quot;symbols in a row&quot; open.</text><text x="28" y="650" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- Cards store IDs and category IDs, never names. Names come from the text catalog, so translating the interface never touches a saved card.</text><text x="28" y="670" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- Photos are files, not database rows: lists stay fast, and a V2 backup can copy the folder. The database stores only the file names.</text><text x="28" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- Dates are ISO text (UTC). IDs are UUIDs, so a V2 import or a V3 pack can add cards without ID clashes.</text><text x="28" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- Only the typed label and custom category names are free text. They are not translated (Functional Analysis section 7).</text><text x="28" y="730" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- No emoji, no theme setting, no category icon, no language setting in V1: the Functional Analysis v0.5 removed them.</text><rect x="20" y="780" width="1160" height="62" rx="8" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="797" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#455A64">Legend</text><rect x="30" y="808" width="22" height="14" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="58" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Our code (inside the APK)</text><rect x="208.0" y="808" width="22" height="14" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="236.0" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Data stored on the device</text><rect x="386.0" y="808" width="22" height="14" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="414.0" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Android feature (not ours)</text><rect x="569.6" y="808" width="22" height="14" rx="4" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/><text x="597.6" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Hosting or outside service</text><rect x="753.2" y="808" width="22" height="14" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="6 4"/><text x="781.2" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Later release (V2, V3)</text><line x1="30" y1="834" x2="64" y2="834" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="70" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Runs on the device (data flow)</text><line x1="270" y1="834" x2="304" y2="834" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><text x="310" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Build, publish or install once</text><line x1="530" y1="834" x2="564" y2="834" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><text x="570" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Future flow</text></svg>