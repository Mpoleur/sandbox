<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><title>System overview</title><defs><marker id="arun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#212121"/></marker><marker id="srun" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#212121"/></marker><marker id="adeploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#455A64"/></marker><marker id="sdeploy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#455A64"/></marker><marker id="afut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B1FA2"/></marker><marker id="sfut" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#7B1FA2"/></marker></defs><rect width="1200" height="800" fill="#FFFFFF"/><text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#212121">Schema 1. Whole system, V1: a native Android app (later releases in purple)</text><rect x="20" y="50" width="340" height="640" rx="14" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="2" stroke-dasharray="8 5"/><text x="34" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#455A64">Matthieu&#x27;s computer and poleur.com</text><rect x="45" y="90" width="290" height="64" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="190.0" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">GitHub repository (private)</text><text x="190.0" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">app code, catalogs, 168 SVG files</text><rect x="45" y="190" width="290" height="96" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="190.0" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Local build (free)</text><text x="190.0" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Expo + Gradle on Windows:</text><text x="190.0" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">npx expo run:android --variant release</text><text x="190.0" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">produces one signed APK file</text><rect x="45" y="326" width="290" height="64" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="190.0" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Default signing key</text><text x="190.0" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">comes with the generated project</text><text x="190.0" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">public; nothing to manage in V1</text><rect x="45" y="436" width="290" height="64" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="2.5"/><text x="190.0" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">poleur.com download page</text><text x="190.0" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">may host the APK file (a plain file)</text><text x="190.0" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">no app logic; the app has no web address</text><polyline points="190,154 190,190" fill="none" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><rect x="173.8" y="154.0" width="32.4" height="16" fill="#FFFFFF" opacity="0.9"/><text x="190.0" y="166.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#455A64">push</text><polyline points="190,326 190,286" fill="none" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><rect x="170.5" y="298" width="39.0" height="16" fill="#FFFFFF" opacity="0.9"/><text x="190" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#455A64">signs</text><polyline points="45,238 32,238 32,468 45,468" fill="none" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><rect x="45" y="530" width="290" height="56" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><text x="190.0" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">V3: card pack files</text><text x="190.0" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">small files on the same host</text><rect x="45" y="606" width="290" height="66" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><text x="190.0" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">V2: translation proxy + provider</text><text x="190.0" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">holds the API key (never in the APK)</text><text x="190.0" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">called only when a card is made or edited</text><rect x="390" y="50" width="790" height="640" rx="14" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="2" stroke-dasharray="8 5"/><text x="404" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#455A64">Android phone or tablet (Samsung Galaxy S22, Xiaomi tablet): one installed app, Android 7 or later</text><rect x="410" y="92" width="360" height="64" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5"/><text x="590.0" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Install from the APK file</text><text x="590.0" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">&quot;unknown source&quot; warning, then update in place</text><text x="590.0" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">only if package name and signing key are the same</text><polyline points="335,468 372,468 372,124 410,124" fill="none" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><rect x="342.6" y="288" width="58.8" height="16" fill="#FFFFFF" opacity="0.9"/><text x="372" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#455A64">download</text><text x="410" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1565C0">The Travel Card app (V1 asks for no internet permission)</text><rect x="410" y="206" width="170" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="495.0" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Screens</text><text x="495.0" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">home, editor + picker,</text><text x="495.0" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">reorder, display, settings</text><rect x="600" y="206" width="180" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="690.0" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Card renderer</text><text x="690.0" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">draws a card everywhere</text><rect x="800" y="206" width="170" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="885.0" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Card logic</text><text x="885.0" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">rules, examples, order</text><rect x="990" y="206" width="170" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="1075.0" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Data access</text><text x="1075.0" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">SQLite and photo files</text><polyline points="580,241 600,241" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="780,241 800,241" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="970,241 990,241" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><rect x="410" y="310" width="360" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="590.0" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Bundled catalogs and artwork</text><text x="590.0" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">symbols.json, en.json, 168 SVG files</text><text x="590.0" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">all inside the APK: nothing to download</text><rect x="800" y="310" width="170" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="885.0" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Photo pipeline</text><text x="885.0" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">shrink, JPEG, keep a copy</text><rect x="990" y="310" width="170" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="1075.0" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Platform adapter</text><text x="1075.0" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">asks Android for features</text><polyline points="495,310 495,276" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="690,310 690,276" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="885,310 885,276" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="410" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2E7D32">Stored on the device</text><rect x="410" y="440" width="270" height="82" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><path d="M410 456Q545.0 470 680 456" fill="none" stroke="#2E7D32" stroke-width="1.5"/><text x="545.0" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">SQLite database</text><text x="545.0" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">cards, categories, settings</text><text x="545.0" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">version number for upgrades</text><rect x="700" y="440" width="270" height="82" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><path d="M700 456Q835.0 470 970 456" fill="none" stroke="#2E7D32" stroke-width="1.5"/><text x="835.0" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Photo files</text><text x="835.0" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">JPEG, long edge 1600 px + thumbnail</text><text x="835.0" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">in the app&#x27;s own folder</text><polyline points="1160,241 1172,241 1172,398 640,398 640,440" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="835,398 835,440" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="990" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#455A64">Android features used</text><rect x="990" y="440" width="170" height="44" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5"/><text x="1075.0" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Camera and photo picker</text><text x="1075.0" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">system screens</text><rect x="990" y="490" width="170" height="44" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5"/><text x="1075.0" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Keep screen on</text><text x="1075.0" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">no permission asked</text><rect x="990" y="540" width="170" height="44" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5"/><text x="1075.0" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Window brightness</text><text x="1075.0" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Could have</text><rect x="990" y="590" width="170" height="44" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5"/><text x="1075.0" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">App-private storage</text><text x="1075.0" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">removed with the app</text><polyline points="1140,380 1140,440" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><rect x="410" y="560" width="270" height="60" rx="8" fill="#FFFFFF" stroke="#212121" stroke-width="2.5"/><text x="545.0" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Reader (a local person)</text><text x="545.0" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">looks at the screen: display mode only</text><rect x="700" y="560" width="270" height="60" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-width="2.5" stroke-dasharray="4 3"/><text x="835.0" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">No server in V1</text><text x="835.0" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">works with the phone in flight mode</text><rect x="20" y="708" width="1160" height="62" rx="8" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="725" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#455A64">Legend</text><rect x="30" y="736" width="22" height="14" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="58" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Our code (inside the APK)</text><rect x="208.0" y="736" width="22" height="14" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="236.0" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Data stored on the device</text><rect x="386.0" y="736" width="22" height="14" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="414.0" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Android feature (not ours)</text><rect x="569.6" y="736" width="22" height="14" rx="4" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/><text x="597.6" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Hosting or outside service</text><rect x="753.2" y="736" width="22" height="14" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="6 4"/><text x="781.2" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Later release (V2, V3)</text><line x1="30" y1="762" x2="64" y2="762" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="70" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Runs on the device (data flow)</text><line x1="270" y1="762" x2="304" y2="762" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><text x="310" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Build, publish or install once</text><line x1="530" y1="762" x2="564" y2="762" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><text x="570" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Future flow</text></svg>