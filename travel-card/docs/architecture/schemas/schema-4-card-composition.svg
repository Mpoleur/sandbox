<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><title>Card composition</title><defs><marker id="arun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#212121"/></marker><marker id="srun" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#212121"/></marker><marker id="adeploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#455A64"/></marker><marker id="sdeploy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#455A64"/></marker><marker id="afut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B1FA2"/></marker><marker id="sfut" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#7B1FA2"/></marker></defs><rect width="1200" height="900" fill="#FFFFFF"/><text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#212121">Schema 4. How a card is composed (real artwork files; positions are percentages of the card square)</text><rect x="20" y="60" width="570" height="290" rx="12" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="2"/><text x="36" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">A. One symbol, up to 2 badges</text><text x="36" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#455A64">Layers, bottom to top: symbol, badge A, badge B</text><rect x="50" y="126" width="200" height="200" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5 4"/><g transform="translate(50 126) scale(3.125)" stroke-linejoin="round" stroke-linecap="round"><path d="M10 22h34v18a14 14 0 0 1-14 14h-6a14 14 0 0 1-14-14z" fill="#6D4C41"/><path d="M44 27h4a6 6 0 0 1 0 12h-4" fill="none" stroke="#6D4C41" stroke-width="5"/><ellipse cx="27" cy="58" rx="24" ry="3" fill="#78909C"/><ellipse cx="27" cy="23" rx="17" ry="3.5" fill="#F6DFAF"/><path d="M20 6c-3 4 3 6 0 10M32 6c-3 4 3 6 0 10" fill="none" stroke="#78909C" stroke-width="3"/></g><g transform="translate(170.0 246.0) scale(1.25)" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="32" r="28.5" fill="#D32F2F" stroke="#FFF" stroke-width="3"/><g transform="translate(32 12) scale(1.7)"><path d="M0 0c6 6 8 10 8 15a8 8 0 0 1-16 0c0-4 2-6 4-9 1 2 2 3 3 3 0-3 0-6 1-9z" fill="#FFFFFF"/><path d="M0 22a4.5 4.5 0 0 1-4.5-5c0-3 3-4 4.5-8 2 3 4.5 5 4.5 8a4.5 4.5 0 0 1-4.5 5z" fill="#D32F2F"/></g></g><rect x="170.0" y="246.0" width="80.0" height="80.0" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 3"/><g transform="translate(170.0 126.0) scale(1.25)" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="32" r="28.5" fill="#1E88E5" stroke="#FFF" stroke-width="3"/><rect x="8" y="42" width="12" height="12" rx="2" fill="#FFFFFF"/><path d="M22 44h22a4.5 4.5 0 0 1 0 9H22z" fill="#FFFFFF"/><rect x="30" y="36" width="6" height="10" rx="3" fill="#FFFFFF"/><path transform="translate(32 9) rotate(90)" d="M0 -4.5L13 -4.5L13 -9.9L22 0L13 9.9L13 4.5L0 4.5Z" fill="#FFFFFF"/></g><rect x="170.0" y="126.0" width="80.0" height="80.0" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 3"/><text x="255" y="170.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#7B1FA2">B</text><text x="255" y="290.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#7B1FA2">A</text><text x="270" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Badge size: 40 % of the card,</text><text x="270" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">taken from its own 64 x 64 file.</text><text x="270" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Slot A: bottom right (60 % across, 60 % down).</text><text x="270" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Slot B: top right (60 % across, 0 % down).</text><text x="270" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">A and B never touch.</text><text x="270" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">First badge chosen goes to A, second to B.</text><rect x="610" y="60" width="570" height="290" rx="12" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="2"/><text x="626" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">B. The &quot;No&quot; rule</text><text x="626" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#455A64">Symbol at 60 %, centred. No sign at 100 %. One more badge in A.</text><rect x="640" y="126" width="200" height="200" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5 4"/><g transform="translate(640 126) scale(3.125)" stroke-linejoin="round" stroke-linecap="round"><g transform="translate(12.8 12.8) scale(0.6)"><g transform="rotate(-35 32 32)"><path d="M20 14c6 0 9 5 12 5s6-5 12-5a12 12 0 0 1 0 36c-6 0-9-5-12-5s-6 5-12 5a12 12 0 0 1 0-36z" fill="#D9A765"/><path d="M16 22l4 4M22 28l4 4M16 34l4 4M44 22l4 4M38 28l4 4M44 34l4 4M24 18l3 3M37 40l3 3" fill="none" stroke="#A8702F" stroke-width="2.5"/></g></g></g><g transform="translate(640 126) scale(3.125)" stroke-linejoin="round" stroke-linecap="round"><g stroke="#FFF" stroke-width="11" fill="none"><circle cx="32" cy="32" r="26"/><path d="M13.6 13.6L50.4 50.4"/></g><g stroke="#D32F2F" stroke-width="7" fill="none"><circle cx="32" cy="32" r="26"/><path d="M13.6 13.6L50.4 50.4"/></g></g><g transform="translate(760.0 246.0) scale(1.25)" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="32" r="28.5" fill="#FFFFFF"/><circle cx="32" cy="32" r="24.5" fill="#FFFFFF" stroke="#D32F2F" stroke-width="6"/><path d="M49 15L43 21M15 49L21 43" fill="none" stroke="#D32F2F" stroke-width="6"/><path d="M18 13h3v10a3 3 0 0 0 6 0V13h3v11a6 6 0 0 1-4.5 5.8V50h-3V29.8A6 6 0 0 1 18 24z" fill="#F57C00"/><rect x="22.5" y="13" width="3" height="12" rx="0" fill="#F57C00"/><ellipse cx="41" cy="23" rx="6" ry="9.5" fill="#F57C00"/><rect x="39.5" y="30" width="3" height="20" rx="1.5" fill="#F57C00"/></g><text x="860" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Symbol: scale 0.6 about the centre,</text><text x="860" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">always the same factor.</text><text x="860" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">No sign (MOD-01): whole card, on top, not scaled.</text><text x="860" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">The other badge keeps slot A at 40 %.</text><text x="860" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">The No ring opens to 70 %, so 60 % always fits.</text><text x="860" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Files in assets/symbols are never changed.</text><rect x="20" y="370" width="570" height="290" rx="12" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="2"/><text x="36" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">C. Symbols already drawn crossed out</text><text x="36" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#455A64">DIE-13, MON-08, REL-01, REL-04, REL-05, REL-06</text><rect x="50" y="436" width="200" height="200" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5 4"/><g transform="translate(50 436) scale(3.125)" stroke-linejoin="round" stroke-linecap="round"><g transform="translate(12.2 12.2) scale(0.6)"><path d="M18 8h28c2 18-4 28-14 28S16 26 18 8z" fill="#D32F2F"/><path d="M32 36V54M22 57H42" fill="none" stroke="#78909C" stroke-width="4"/></g><g stroke="#FFF" stroke-width="11" fill="none"><circle cx="32" cy="32" r="26"/><path d="M13.6 13.6L50.4 50.4"/></g><g stroke="#D32F2F" stroke-width="7" fill="none"><circle cx="32" cy="32" r="26"/><path d="M13.6 13.6L50.4 50.4"/></g></g><text x="270" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">The file already holds the object at 60 %</text><text x="270" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">plus the No sign. The app draws it at 100 %,</text><text x="270" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">never scaled a second time.</text><text x="270" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Catalog flag: alreadyCrossed = true.</text><text x="270" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Decided (FA v0.5): MOD-01 is not offered</text><text x="270" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">on these six, to avoid a double &quot;no&quot;.</text><rect x="610" y="370" width="570" height="290" rx="12" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="2"/><text x="626" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="start" fill="#212121">D. Symbol card with a photo</text><text x="626" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#455A64">Symbol card on top, photo just below (split: Dali)</text><rect x="680" y="428" width="110" height="110" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5 4"/><g transform="translate(680 428) scale(1.71875)" stroke-linejoin="round" stroke-linecap="round"><path d="M14 38L20 26H38L46 38Z" fill="#FFC107"/><rect x="8" y="36" width="44" height="14" rx="5" fill="#FFC107"/><path d="M22 36L25 29H30V36ZM33 36V29H37L42 36Z" fill="#BBDEFB"/><circle cx="19" cy="52" r="6" fill="#212121"/><circle cx="41" cy="52" r="6" fill="#212121"/><circle cx="19" cy="52" r="2.2" fill="#CFD8DC"/><circle cx="41" cy="52" r="2.2" fill="#CFD8DC"/><rect x="8" y="40" width="4" height="3" rx="0" fill="#212121"/><rect x="8" y="43" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="12" y="40" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="12" y="43" width="4" height="3" rx="0" fill="#212121"/><rect x="16" y="40" width="4" height="3" rx="0" fill="#212121"/><rect x="16" y="43" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="20" y="40" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="20" y="43" width="4" height="3" rx="0" fill="#212121"/><rect x="24" y="40" width="4" height="3" rx="0" fill="#212121"/><rect x="24" y="43" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="28" y="40" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="28" y="43" width="4" height="3" rx="0" fill="#212121"/><rect x="32" y="40" width="4" height="3" rx="0" fill="#212121"/><rect x="32" y="43" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="36" y="40" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="36" y="43" width="4" height="3" rx="0" fill="#212121"/><rect x="40" y="40" width="4" height="3" rx="0" fill="#212121"/><rect x="40" y="43" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="44" y="40" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="44" y="43" width="4" height="3" rx="0" fill="#212121"/><rect x="48" y="40" width="4" height="3" rx="0" fill="#212121"/><rect x="48" y="43" width="4" height="3" rx="0" fill="#FFFFFF"/><rect x="22" y="12" width="16" height="8" rx="2" fill="#FFFFFF" stroke="#90A4AE" stroke-width="2"/><rect x="25" y="14" width="10" height="4" rx="1" fill="#212121"/></g><g transform="translate(746.0 494.0) scale(0.6875)" stroke-linejoin="round" stroke-linecap="round"><circle cx="32" cy="32" r="28.5" fill="#1E88E5" stroke="#FFF" stroke-width="3"/><path d="M21 24a11 11 0 1 1 15 10c-3 2-4 4-4 7" fill="none" stroke="#FFFFFF" stroke-width="7"/><circle cx="32" cy="51" r="3.8" fill="#FFFFFF"/></g><rect x="640" y="548" width="190" height="90" fill="#ECEFF1" stroke="#78909C" stroke-width="2"/><text x="735" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#455A64">Photo (JPEG)</text><text x="735" y="606" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#455A64">fitted, never cropped</text><text x="860" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Photo only: fills the screen, fitted.</text><text x="860" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Symbol only: as large as the screen allows.</text><text x="860" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Label: drawn only when showLabel is on.</text><text x="860" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Only library symbols: no emoji in V1.</text><text x="860" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Label: never inside the artwork.</text><text x="860" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#263238">Photo + symbol: exact split from the mock-up.</text><text x="20" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#212121">Rules that make this safe to extend</text><text x="28" y="702" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- One renderer draws everything (home thumbnails, editor preview, display mode). Sizes are percentages, so one code path serves a 32 px thumbnail and a tablet.</text><text x="28" y="722" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- Symbols are drawn from the bundled SVG files with react-native-svg and positioned by percentages. No file is edited or recoloured: the artwork stays as Dali delivered it.</text><text x="28" y="742" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- Several symbols in a row (future): the renderer divides the width by the number of items and draws each item with its own badges. Nothing else changes.</text><text x="28" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- Display mode is always white and there is no theme setting (FA v0.5), because the artwork is designed for white (Artwork Style Guideline section 7).</text><text x="28" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#263238">- A symbol ID unknown to the catalog (for example retired later) draws a neutral grey placeholder tile instead of failing.</text><rect x="20" y="822" width="1160" height="62" rx="8" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="839" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#455A64">Legend</text><rect x="30" y="850" width="22" height="14" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="58" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Our code (inside the APK)</text><rect x="208.0" y="850" width="22" height="14" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="236.0" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Data stored on the device</text><rect x="386.0" y="850" width="22" height="14" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="414.0" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Android feature (not ours)</text><rect x="569.6" y="850" width="22" height="14" rx="4" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/><text x="597.6" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Hosting or outside service</text><rect x="753.2" y="850" width="22" height="14" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="6 4"/><text x="781.2" y="862" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Later release (V2, V3)</text><line x1="30" y1="876" x2="64" y2="876" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="70" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Runs on the device (data flow)</text><line x1="270" y1="876" x2="304" y2="876" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><text x="310" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Build, publish or install once</text><line x1="530" y1="876" x2="564" y2="876" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><text x="570" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Future flow</text></svg>