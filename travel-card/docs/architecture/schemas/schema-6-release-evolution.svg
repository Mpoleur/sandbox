<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820"><title>Release evolution</title><defs><marker id="arun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#212121"/></marker><marker id="srun" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#212121"/></marker><marker id="adeploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#455A64"/></marker><marker id="sdeploy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#455A64"/></marker><marker id="afut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B1FA2"/></marker><marker id="sfut" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#7B1FA2"/></marker></defs><rect width="1200" height="820" fill="#FFFFFF"/><text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#212121">Schema 6. How later releases plug in without redoing V1</text><rect x="410" y="300" width="380" height="226" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="600.0" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Contracts fixed in V1</text><text x="600.0" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F"></text><text x="600.0" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">1. Symbol IDs are permanent (never reused)</text><text x="600.0" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">2. A card is an ordered list of items,</text><text x="600.0" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">    each item with its own badges</text><text x="600.0" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">3. Cards store IDs; texts come from catalogs</text><text x="600.0" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">4. Every record has a UUID; the database has a</text><text x="600.0" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">    version number with upgrade steps</text><text x="600.0" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">5. All user data can be written as one file</text><text x="600.0" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">6. Package name and signing key stay the same</text><rect x="20" y="70" width="360" height="110" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><text x="200.0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">V2: translated text cards</text><text x="200.0" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">New item kind &quot;text&quot;; new Translation table</text><text x="200.0" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">New: a network call through a proxy (the API key</text><text x="200.0" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">stays on the proxy, never in the APK)</text><rect x="420" y="70" width="360" height="110" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><text x="600.0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">V2: export, import, reminder</text><text x="600.0" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">New: write the database rows and the photo files</text><text x="600.0" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">into one file; read it back (adds copies, new IDs)</text><text x="600.0" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Unchanged: the data model</text><rect x="820" y="70" width="360" height="110" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><text x="1000.0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">V3: shareable packs</text><text x="1000.0" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Pack = the same file, downloaded or opened</text><text x="1000.0" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">from a link; same import code</text><text x="1000.0" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Unchanged: symbol IDs, renderer</text><rect x="20" y="590" width="360" height="110" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><text x="200.0" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Several symbols in a row</text><text x="200.0" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Change one constant: max items 1 to N</text><text x="200.0" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Renderer divides the width per item</text><text x="200.0" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Unchanged: data, badges, slots, storage</text><rect x="420" y="590" width="360" height="110" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><text x="600.0" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">More interface languages</text><text x="600.0" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Add fr.json etc. and a language setting</text><text x="600.0" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Names and meanings follow automatically</text><text x="600.0" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Unchanged: cards, symbols, renderer</text><rect x="820" y="590" width="360" height="110" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5" stroke-dasharray="6 4"/><text x="1000.0" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">iPhone later (FA 4.1)</text><text x="1000.0" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Same Expo code base; the platform adapter</text><text x="1000.0" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">answers for iOS; brightness behaves differently</text><text x="1000.0" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Unchanged: data format, screens (to be checked)</text><polyline points="200,180 200,215 500,215 500,300" fill="none" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><polyline points="600,180 600,300" fill="none" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><polyline points="1000,180 1000,215 700,215 700,300" fill="none" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><polyline points="200,590 200,556 500,556 500,526" fill="none" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><polyline points="600,590 600,526" fill="none" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><polyline points="1000,590 1000,556 700,556 700,526" fill="none" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><rect x="20" y="742" width="1160" height="62" rx="8" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="759" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#455A64">Legend</text><rect x="30" y="770" width="22" height="14" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="58" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Our code (inside the APK)</text><rect x="208.0" y="770" width="22" height="14" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="236.0" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Data stored on the device</text><rect x="386.0" y="770" width="22" height="14" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="414.0" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Android feature (not ours)</text><rect x="569.6" y="770" width="22" height="14" rx="4" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/><text x="597.6" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Hosting or outside service</text><rect x="753.2" y="770" width="22" height="14" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="6 4"/><text x="781.2" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Later release (V2, V3)</text><line x1="30" y1="796" x2="64" y2="796" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="70" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Runs on the device (data flow)</text><line x1="270" y1="796" x2="304" y2="796" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><text x="310" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Build, publish or install once</text><line x1="530" y1="796" x2="564" y2="796" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><text x="570" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Future flow</text></svg>