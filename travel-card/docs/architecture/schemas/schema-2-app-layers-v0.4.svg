<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820"><title>App layers</title><defs><marker id="arun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#212121"/></marker><marker id="srun" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#212121"/></marker><marker id="adeploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#455A64"/></marker><marker id="sdeploy" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#455A64"/></marker><marker id="afut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7B1FA2"/></marker><marker id="sfut" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#7B1FA2"/></marker></defs><rect width="1200" height="820" fill="#FFFFFF"/><text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#212121">Schema 2. Inside the app: layers and who may talk to whom (V1)</text><text x="20" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1565C0">Layer 1: screens</text><rect x="20" y="72" width="215" height="74" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="127.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Home</text><text x="127.5" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Favourites first, then categories,</text><text x="127.5" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">search, three-dot menu (Reorder)</text><rect x="255" y="72" width="215" height="74" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="362.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Symbol picker (the library)</text><text x="362.5" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">14 groups, search by name, large</text><text x="362.5" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">preview on long press; 143 + 15</text><rect x="490" y="72" width="215" height="74" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="597.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Card editor</text><text x="597.5" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">picker, 2 badges, photo,</text><text x="597.5" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">label, category</text><rect x="725" y="72" width="215" height="74" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="832.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Display mode</text><text x="832.5" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">full screen, system bars hidden,</text><text x="832.5" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">white, tap to close, landscape</text><rect x="960" y="72" width="215" height="74" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="1067.5" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Settings</text><text x="1067.5" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">Categories, restore examples,</text><text x="1067.5" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">notice, about, brightness</text><rect x="20" y="162" width="1155" height="40" rx="8" fill="#FFFFFF" stroke="#90A4AE" stroke-dasharray="4 3"/><text x="597" y="187" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#37474F">Rule: screens call services only. They never open the database, read files or call Android features themselves.</text><polyline points="597,146 597,162" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="597,202 597,236" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="20" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1565C0">Layer 2: services (the logic, written once, testable without a screen)</text><rect x="20" y="242" width="215" height="86" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="127.5" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Card service</text><text x="127.5" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">max 2 badges, max items (1 in V1)</text><text x="127.5" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">examples, restore examples</text><text x="127.5" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">order per category, favourites</text><rect x="255" y="242" width="215" height="86" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="362.5" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Photo pipeline</text><text x="362.5" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">pick or take, shrink to JPEG</text><text x="362.5" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">copy to the permanent folder</text><text x="362.5" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">thumbnail, delete orphans</text><rect x="490" y="242" width="215" height="86" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="597.5" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Catalog and texts</text><text x="597.5" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">symbols.json (language-free)</text><text x="597.5" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">t(key) for every text</text><text x="597.5" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">hidden = needs-check flag</text><rect x="725" y="242" width="215" height="86" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="832.5" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Card renderer</text><text x="832.5" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">draws any card at any size</text><text x="832.5" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">No rule (60 %), badge slots,</text><text x="832.5" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">photo below the symbol</text><rect x="960" y="242" width="215" height="86" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/><text x="1067.5" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Platform adapter</text><text x="1067.5" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">keep screen on, system bars,</text><text x="1067.5" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">brightness, camera, picker,</text><text x="1067.5" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">orientation: one Android door</text><text x="140" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2E7D32">Layer 3: storage and Android</text><rect x="20" y="382" width="215" height="86" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><path d="M20 398Q127.5 412 235 398" fill="none" stroke="#2E7D32" stroke-width="1.5"/><text x="127.5" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">SQLite database</text><text x="127.5" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">cards, items, categories,</text><text x="127.5" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">settings; version number</text><rect x="255" y="382" width="215" height="86" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/><path d="M255 398Q362.5 412 470 398" fill="none" stroke="#2E7D32" stroke-width="1.5"/><text x="362.5" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Photo files</text><text x="362.5" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">JPEG and thumbnails in the</text><text x="362.5" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">app&#x27;s private folder</text><rect x="490" y="382" width="215" height="86" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5"/><text x="597.5" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Bundled files</text><text x="597.5" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">symbols.json, en.json,</text><text x="597.5" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">168 SVG files (in the APK)</text><rect x="725" y="382" width="215" height="86" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5"/><text x="832.5" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Drawing</text><text x="832.5" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">SVG shapes drawn by</text><text x="832.5" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">react-native-svg</text><rect x="960" y="382" width="215" height="86" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2.5"/><text x="1067.5" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#212121">Android</text><text x="1067.5" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">camera, picker, screen-on,</text><text x="1067.5" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#37474F">window brightness</text><polyline points="127,328 127,382" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="362,328 362,382" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="597,328 597,382" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="832,328 832,382" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><polyline points="1067,328 1067,382" fill="none" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="20" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#212121">Who owns which rule (so Dave does not have to guess)</text><rect x="20" y="520" width="1155" height="38" rx="6" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#212121">Card composition (one main symbol, up to 2 badges, No at 60 %, photo below)</text><text x="30" y="551" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#37474F">Card renderer. Used by the home grid, the editor preview and display mode, so all three always look the same.</text><rect x="20" y="564" width="1155" height="38" rx="6" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#212121">Culture-check symbols hidden until reviewed</text><text x="30" y="595" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#37474F">Catalog and texts: one flag per symbol. It hides the symbol in the picker and the search only. A card that already uses it still draws.</text><rect x="20" y="608" width="1155" height="38" rx="6" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#212121">Text in any language</text><text x="30" y="639" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#37474F">Catalog and texts: no screen holds a word. Cards store IDs, never names. Free-text labels stay as typed.</text><rect x="20" y="652" width="1155" height="38" rx="6" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="668" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#212121">Which badges may go on which symbol (MOD-01 not on the six crossed-out symbols)</text><text x="30" y="683" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#37474F">Card service, using the alreadyCrossed flag from the catalog. The editor only offers what the service allows.</text><rect x="20" y="696" width="1155" height="38" rx="6" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#212121">Data format and upgrades</text><text x="30" y="727" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" fill="#37474F">Card service plus the database version number. Every change of the stored shape ships with an upgrade step.</text><rect x="20" y="745" width="1160" height="62" rx="8" fill="#FFFFFF" stroke="#CFD8DC"/><text x="30" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#455A64">Legend</text><rect x="30" y="773" width="22" height="14" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="58" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Our code (inside the APK)</text><rect x="208.0" y="773" width="22" height="14" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="236.0" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Data stored on the device</text><rect x="386.0" y="773" width="22" height="14" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/><text x="414.0" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Android feature (not ours)</text><rect x="569.6" y="773" width="22" height="14" rx="4" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/><text x="597.6" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Hosting or outside service</text><rect x="753.2" y="773" width="22" height="14" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="6 4"/><text x="781.2" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Later release (V2, V3)</text><line x1="30" y1="799" x2="64" y2="799" stroke="#212121" stroke-width="2.2" marker-end="url(#arun)"/><text x="70" y="803" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Runs on the device (data flow)</text><line x1="270" y1="799" x2="304" y2="799" stroke="#455A64" stroke-width="2.2" stroke-dasharray="9 5" marker-end="url(#adeploy)"/><text x="310" y="803" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Build, publish or install once</text><line x1="530" y1="799" x2="564" y2="799" stroke="#7B1FA2" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#afut)"/><text x="570" y="803" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#212121">Future flow</text></svg>